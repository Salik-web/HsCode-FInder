# Deploy the public demo. Manual only: Actions -> "Deploy demo" -> Run workflow.
#
# Builds the image here and pushes it to GHCR; the Hugging Face Space repo then holds only
# its README and a one-line Dockerfile (FROM that image), because Spaces reject binary
# files (sample PDFs, the tariff) pushed without Xet. Every deploy is pinned to a commit.
#
# Needs: repository secret HF_TOKEN (a Hugging Face write token), repository variable
# HF_SPACE (e.g. your-name/tradedoc-ai), and the GHCR package made public once.
name: Deploy demo

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tradedoc-ai" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Point the Space at this image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ vars.HF_SPACE }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          test -n "$HF_TOKEN" && test -n "$SPACE" || { echo "Set HF_TOKEN and HF_SPACE"; exit 1; }
          mkdir space && cd space
          git init -q -b main
          cp ../deploy/space_README.md README.md
          printf 'FROM %s\n' "$IMAGE" > Dockerfile
          git add README.md Dockerfile
          git -c user.name="tradedoc-deploy" -c user.email="deploy@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://${SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" main
