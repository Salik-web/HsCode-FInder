[project]
name = "tradedoc-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "openai>=3.49.0",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.15.0",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
evals = [
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
]
synth = [
    "faker>=40.44.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "playwright>=1.64.1",
]
ui = [
    "streamlit>=1.67.0",
]

[tool.uv]
default-groups = ["dev", "evals", "synth", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F, ARG, ERA and RUF100 are the unused-code rules: unused imports and variables, unused
# arguments, commented-out code and stale noqa comments.
select = ["E", "W", "F", "I", "UP", "B", "ARG", "ERA", "T20", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"synth/generate.py" = ["T20"]
"evals/run.py" = ["T20"]
"evals/guardrails.py" = ["T20"]
"synth/inject.py" = ["T20"]
"evals/hs_run.py" = ["T20"]
"tariff/parse.py" = ["T20"]
"tariff/ingest.py" = ["T20"]
"app/demo.py" = ["T20"]
"evals/gate.py" = ["T20"]

# Linux (the Docker image, CI): CPU-only torch. PyPI's Linux wheel pulls CUDA (gigabytes);
# Windows and macOS wheels on PyPI are CPU-only already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
